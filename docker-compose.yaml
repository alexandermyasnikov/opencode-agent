services:
  opencode:
    build:
      context: .
    ports:
      - "127.0.0.1:49374:49374"
    env_file:
      - ~/.config/opencode/.env
    restart: unless-stopped
    depends_on:
      - docker-dind
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      DOCKER_HOST: tcp://docker-dind:2375
    volumes:
      - ./root/.config/opencode:/root/.config/opencode
      - ./root/.config/ssh-mcp:/root/.config/ssh-mcp
      - ./root/.gitconfig:/root/.gitconfig
      - ./root/.gitconfig_private:/root/.gitconfig_private
      - ./root/_gitignore:/root/.gitignore

      - opencode-data:/root/.local/share/opencode
      - serena-data:/root/.serena
      - opencode-mem-data:/root/.opencode-mem/data

      - opencode-cache:/root/.cache/opencode
      - codebase-memory-cache:/root/.cache/codebase-memory-mcp
    command:
      - /root/.opencode/bin/opencode
      - serve
      - --hostname=0.0.0.0
      - --port=49374
      - --log-level=warn
      - --print-logs=true
    networks:
      - opencode

  docker-dind:
    image: docker:29-dind
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    networks:
      - opencode
    volumes:
      - docker-data:/var/lib/docker

networks:
  opencode:

volumes:
  docker-data:
  opencode-data:
  serena-data:
  opencode-mem-data:
  opencode-cache:
  codebase-memory-cache:
